[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-scanner"
version = "0.1.0"
description = "CLI that scans a repository and reports structure, language mix, dead files and risky patterns."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
codebase-scanner = "codebase_scanner.cli:main"

[tool.setuptools]
packages = ["codebase_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
